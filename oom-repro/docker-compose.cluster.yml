x-greptimedb: &greptimedb
  image: greptime/greptimedb:v1.0.0-rc.2-nightly-20260330

services:
  postgres:
    image: postgres:17-alpine
    container_name: repro-postgres
    environment:
      POSTGRES_USER: greptime
      POSTGRES_PASSWORD: greptime
      POSTGRES_DB: metasrv

  metasrv:
    <<: *greptimedb
    container_name: repro-metasrv
    restart: on-failure
    command:
      - metasrv
      - start
      - --rpc-bind-addr=0.0.0.0:3002
      - --rpc-server-addr=metasrv:3002
      - --backend=postgres-store
      - "--store-addrs=host=postgres port=5432 user=greptime password=greptime dbname=metasrv"
    depends_on:
      - postgres

  datanode0:
    <<: *greptimedb
    container_name: repro-datanode0
    mem_limit: 8g
    command:
      - datanode
      - start
      - --node-id=0
      - --data-home=/data
      - --rpc-bind-addr=0.0.0.0:3001
      - --rpc-server-addr=datanode0:3001
      - --metasrv-addrs=metasrv:3002
    volumes:
      - datanode0-data:/data
    depends_on:
      - metasrv

  datanode1:
    <<: *greptimedb
    container_name: repro-datanode1
    mem_limit: 8g
    command:
      - datanode
      - start
      - --node-id=1
      - --data-home=/data
      - --rpc-bind-addr=0.0.0.0:3001
      - --rpc-server-addr=datanode1:3001
      - --metasrv-addrs=metasrv:3002
    volumes:
      - datanode1-data:/data
    depends_on:
      - metasrv

  datanode2:
    <<: *greptimedb
    container_name: repro-datanode2
    mem_limit: 8g
    command:
      - datanode
      - start
      - --node-id=2
      - --data-home=/data
      - --rpc-bind-addr=0.0.0.0:3001
      - --rpc-server-addr=datanode2:3001
      - --metasrv-addrs=metasrv:3002
    volumes:
      - datanode2-data:/data
    depends_on:
      - metasrv

  frontend:
    <<: *greptimedb
    container_name: repro-frontend
    ports:
      - "4000:4000"
      - "5433:4003"
    command:
      - frontend
      - start
      - --metasrv-addrs=metasrv:3002
      - --postgres-addr=0.0.0.0:4003
      - --http-addr=0.0.0.0:4000
    depends_on:
      - datanode0
      - datanode1
      - datanode2

volumes:
  datanode0-data:
  datanode1-data:
  datanode2-data:
